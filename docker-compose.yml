services:
  api:
    build: ./backend
    container_name: helmos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    networks:
      - helmos

  postgres:
    image: pgvector/pgvector:pg16
    container_name: helmos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helmos
      POSTGRES_PASSWORD: helmos_pass
      POSTGRES_DB: helmos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmos -d helmos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helmos

  redis:
    image: redis:7-alpine
    container_name: helmos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helmos

networks:
  helmos:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
